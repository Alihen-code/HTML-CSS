
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rare Sneakers</title>

   <style>
        
/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================
   PAGE
========================= */

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at top, #252525, #080808 55%);

    font-family: Arial, Helvetica, sans-serif;

    color: white;

    overflow: hidden;
}


/* =========================
   MAIN CONTAINER
========================= */

.page {
    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px;
}


/* =========================
   SNEAKER CARD
========================= */

.sneaker-card {
    width: 380px;
    min-height: 570px;

    position: relative;

    display: flex;
    flex-direction: column;

    padding: 28px;

    border-radius: 28px;

    background: rgba(18, 18, 18, 0.96);

    overflow: hidden;

    isolation: isolate;

    box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.6);

    transition: 0.4s ease;
}


/* =========================
   RGB BORDER
========================= */

.sneaker-card::before {
    content: "";

    position: absolute;

    inset: -3px;

    z-index: -2;

    border-radius: 31px;

    background: conic-gradient(
        from 0deg,
        #ff0055,
        #ff7b00,
        #ffee00,
        #00ff88,
        #00d9ff,
        #4d5cff,
        #b000ff,
        #ff0055
    );

    animation: rgbBorder 6s linear infinite;
}


/* Inner layer that hides the center of the gradient */

.sneaker-card::after {
    content: "";

    position: absolute;

    inset: 3px;

    z-index: -1;

    border-radius: 25px;

    background: #111111;
}


/* =========================
   RGB ANIMATION
========================= */

@keyframes rgbBorder {

    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }

}


/* =========================
   CARD HOVER
========================= */

.sneaker-card:hover {
    transform: translateY(-10px) scale(1.01);

    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.8),
        0 0 35px rgba(0, 217, 255, 0.15);
}


/* =========================
   PRICE TAG
========================= */

.price-tag {
    position: absolute;

    top: 22px;
    right: 22px;

    padding: 9px 16px;

    border-radius: 50px;

    background: white;

    color: #111;

    font-size: 14px;
    font-weight: bold;

    letter-spacing: 0.5px;

    box-shadow:
        0 8px 20px rgba(0, 0, 0, 0.35);

    z-index: 5;

    transition: 0.3s ease;
}


.sneaker-card:hover .price-tag {
    transform: translateY(-3px) rotate(2deg);
}


/* =========================
   SNEAKER IMAGE
========================= */

.sneaker-image {
    width: 100%;
    height: 280px;

    margin-top: 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 20px;

    background:
        radial-gradient(
            circle,
            #ffffff 0%,
            #eeeeee 45%,
            #cfcfcf 100%
        );

    overflow: hidden;
}


/* Sneaker itself */

.sneaker-image img {
    width: 110%;
    height: 110%;

    object-fit: cover;

    mix-blend-mode: multiply;

    transition: 0.5s ease;
}


.sneaker-card:hover .sneaker-image img {
    transform: scale(1.08) rotate(-2deg);
}


/* =========================
   INFORMATION
========================= */

.sneaker-info {
    padding-top: 25px;
}


/* Small category */

.sneaker-label {
    display: inline-block;

    margin-bottom: 8px;

    font-size: 10px;

    letter-spacing: 3px;

    color: #888;
}


/* Sneaker name */

.sneaker-info h1 {
    font-size: 32px;

    line-height: 1.1;

    margin-bottom: 12px;

    letter-spacing: -1px;
}


/* Description */

.sneaker-info p {
    color: #aaa;

    font-size: 14px;

    line-height: 1.6;

    max-width: 310px;
}


/* =========================
   SHOE DETAILS
========================= */

.shoe-details {
    display: flex;

    gap: 8px;

    margin-top: 18px;

    flex-wrap: wrap;
}


.shoe-details span {
    padding: 7px 11px;

    border: 1px solid #333;

    border-radius: 20px;

    font-size: 11px;

    color: #bbb;

    background: rgba(255, 255, 255, 0.03);
}


/* =========================
   BUTTON
========================= */

.details-btn {
    width: 100%;

    margin-top: 20px;

    padding: 13px;

    border: none;

    border-radius: 12px;

    background: white;

    color: #111;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.3s ease;
}


.details-btn:hover {
    background: #111;

    color: white;

    box-shadow:
        inset 0 0 0 1px #444;

    transform: translateY(-2px);
}


/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .page {
        padding: 20px;
    }

    .sneaker-card {
        width: 100%;
        max-width: 360px;

        min-height: 550px;

        padding: 22px;
    }

    .sneaker-image {
        height: 250px;
    }

    .sneaker-info h1 {
        font-size: 28px;
    }

}


   </style>
</head>

<body>

    <main class="page">

        <div class="sneaker-card">

            <!-- Price -->
            <div class="price-tag">
                $1,299
            </div>

            <!-- Sneaker Image -->
            <div class="sneaker-image">
                <img
                    src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1000&q=80"
                    alt="White sneaker"
                    onerror="this.src='https://placehold.co/800x600/f5f5f5/111?text=Sneaker+Image'"
                >
            </div>

            <!-- Sneaker Information -->
            <div class="sneaker-info">

                <span class="sneaker-label">
                    RARE COLLECTION
                </span>

                <h1>
                    Air Jordan 1
                </h1>

                <p>
                    A legendary silhouette with a clean white finish,
                    inspired by the pairs that became icons of sneaker culture.
                </p>

                <div class="shoe-details">
                    <span>Limited Edition</span>
                    <span>US 10</span>
                    <span>2026</span>
                </div>

                <button class="details-btn">
                    View Details
                </button>

            </div>

        </div>

    </main>

</body>
</html>
