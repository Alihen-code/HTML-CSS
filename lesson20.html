 <!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    
       <h1 id="title">Student Survey Form</h1>

    <p id="description">
        Please fill out this survey to help us improve our learning platform.
    </p>

    <form id="survey-form">

        <!-- Name -->
        <label id="name-label" for="name">Full Name:</label><br>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required>
        <br><br>

        <!-- Email -->
        <label id="email-label" for="email">Email Address:</label><br>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required>
        <br><br>

        <!-- Number -->
        <label id="number-label" for="number">Age:</label><br>
        <input
            type="number"
            id="number"
            name="age"
            placeholder="Your age"
            min="10"
            max="100">
        <br><br>

        <!-- Dropdown -->
        <label for="dropdown">Current Education Level:</label><br>
        <select id="dropdown" name="education">
            <option value="">Select an option</option>
            <option value="high-school">High School</option>
            <option value="college">College</option>
            <option value="university">University</option>
        </select>
        <br><br>

        <!-- Radio Buttons -->
        <p>How did you hear about us?</p>

        <input
            type="radio"
            id="social"
            name="source"
            value="social-media">
        <label for="social">Social Media</label><br>

        <input
            type="radio"
            id="friend"
            name="source"
            value="friend">
        <label for="friend">Friend</label><br>

        <input
            type="radio"
            id="search"
            name="source"
            value="search-engine">
        <label for="search">Search Engine</label>

        <br><br>

        <!-- Checkboxes -->
        <p>Which programming languages are you interested in?</p>

        <input
            type="checkbox"
            id="html"
            name="language"
            value="HTML">
        <label for="html">HTML</label><br>

        <input
            type="checkbox"
            id="css"
            name="language"
            value="CSS">
        <label for="css">CSS</label><br>

        <input
            type="checkbox"
            id="javascript"
            name="language"
            value="JavaScript">
        <label for="javascript">JavaScript</label><br>

        <input
            type="checkbox"
            id="react"
            name="language"
            value="React">
        <label for="react">React</label>

        <br><br>

        <!-- Textarea -->
        <label for="comments">Additional Comments:</label><br>
        <textarea
            id="comments"
            name="comments"
            rows="5"
            cols="40"
            placeholder="Enter your comments here..."></textarea>

        <br><br>

        <!-- Submit Button -->
        <button id="submit" type="submit">
            Submit
        </button>

    </form>

  </body>
</html>
