<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GCD Calculator</title>
    <script>
      function calculateGCD() {
        let number1 = parseInt(document.getElementById("inputnumber1").value);
        let number2 = parseInt(document.getElementById("inputnumber2").value);

        if (number1 <= 0 || number2 <= 0 || isNaN(number1) || isNaN(number2)) {
          alert("please enter valid positive integers.");
          return;
        }

        //using the euclidean algorithem to find gcd
        while (number2 !== 0) {
          let temp = number2;
          number2 = number1 % number2;
          number1 = temp;
        }

        //diplaying the result

        document.getElementById("gcdresult").innerHTML =
          "The GCD OF " +
          number1 +
          " and " +
          parseInt(document.getElementById("inputnumber2").value) +
          " is: " +
          number1;
      }
    </script>
  </head>
  <body>
    <h2>GCD Calculator</h2>
    <lable for="inputnumber1">Enter a Number:</lable>
    <input type="number" id="inputnumber1" name="inputnumber1" />
    <br /><br />
    <lable for="inputnumber2">Enter a Second Number:</lable>
    <input type="number" id="inputnumber2" name="inputnumber2" />
    <br /><br />
    <button type="button" onclick="calculateGCD()">Calculate GCD</button>
    <br /><br />
    <p id="gcdresult"></p>
  </body>
</html>
